name: Assemble anime hero asset

on:
  push:
    branches:
      - fix/use-single-hd-anime-hero-asset
    paths:
      - "assets/_hero_parts/**"

permissions:
  contents: write

concurrency:
  group: assemble-anime-hero-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Rebuild one JPEG from staged text chunks
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d assets/_hero_parts ]]; then
            echo "No staged parts remain; nothing to assemble."
            exit 0
          fi

          python - <<'PY'
          import base64
          from pathlib import Path

          parts_dir = Path("assets/_hero_parts")
          parts = sorted(parts_dir.glob("*.b64"))
          if len(parts) != 7:
              raise SystemExit(f"Expected 7 base64 parts; found {len(parts)}")

          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          image_bytes = base64.b64decode(encoded, validate=True)

          if not image_bytes.startswith(b"\xff\xd8") or not image_bytes.endswith(b"\xff\xd9"):
              raise SystemExit("Reassembled bytes are not a complete JPEG")

          destination = Path("assets/ripan-anime-hero.jpg")
          destination.write_bytes(image_bytes)
          print(f"Created {destination}: {len(image_bytes):,} bytes")
          PY

          rm -rf assets/_hero_parts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/_hero_parts assets/ripan-anime-hero.jpg

          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi

          git commit -m "Add single high-resolution anime hero banner"
          git push origin "HEAD:${GITHUB_REF_NAME}"
