name: Update Latest Projects

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/latest-projects.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-projects
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest public repositories and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Ripanrz
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime

          username = os.environ["USERNAME"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "latest-projects-readme-updater",
          }

          # Fetch up to three pages so forks/profile repositories do not crowd out
          # the latest original projects.
          repositories = []
          for page in range(1, 4):
              url = (
                  f"https://api.github.com/users/{username}/repos"
                  f"?type=owner&sort=pushed&direction=desc&per_page=100&page={page}"
              )
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      page_data = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"GitHub API request failed ({error.code}): {details[:1000]}"
                  )
              except Exception as error:
                  raise SystemExit(f"Could not fetch repositories: {error}")

              if not page_data:
                  break
              repositories.extend(page_data)
              if len(page_data) < 100:
                  break

          latest = [
              repo for repo in repositories
              if repo.get("name", "").casefold() != username.casefold()
              and not repo.get("fork", False)
              and not repo.get("archived", False)
              and not repo.get("private", False)
              and repo.get("html_url")
          ][:3]

          if not latest:
              raise SystemExit(
                  "No eligible public, non-fork repositories found. "
                  "README was left unchanged."
              )

          blocks = []
          for repo in latest:
              name = repo["name"]
              url = repo["html_url"]
              description = (repo.get("description") or "No description provided.").strip()
              language = repo.get("language")
              topics = repo.get("topics") or []

              labels = []
              if language:
                  labels.append(language)
              labels.extend(topic for topic in topics if topic not in labels)
              tech_line = " · ".join(labels[:6]) if labels else "Engineering Project"

              pushed_at = repo.get("pushed_at")
              if pushed_at:
                  try:
                      pushed = datetime.fromisoformat(
                          pushed_at.replace("Z", "+00:00")
                      ).strftime("%Y-%m-%d")
                  except ValueError:
                      pushed = pushed_at[:10]
                  activity_line = f"**Last push:** {pushed}"
              else:
                  activity_line = ""

              block = (
                  f"### [{name}]({url})\n\n"
                  f"{description}\n\n"
                  f"**Tech:** {tech_line}"
              )
              if activity_line:
                  block += f"  \n{activity_line}"
              blocks.append(block)

          new_content = "\n\n---\n\n".join(blocks)

          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- LATEST-PROJECTS:START -->"
          end_marker = "<!-- LATEST-PROJECTS:END -->"
          if readme.count(start_marker) != 1 or readme.count(end_marker) != 1:
              raise SystemExit(
                  "README must contain exactly one LATEST-PROJECTS START and END marker. "
                  "README was left unchanged."
              )

          pattern = re.compile(
              r"(<!-- LATEST-PROJECTS:START -->).*?(<!-- LATEST-PROJECTS:END -->)",
              re.DOTALL,
          )
          updated = pattern.sub(
              lambda match: (
                  match.group(1) + "\n\n" + new_content + "\n\n" + match.group(2)
              ),
              readme,
              count=1,
          )

          if updated == readme:
              print("Latest Projects are already up to date; no README change needed.")
          else:
              with open(readme_path, "w", encoding="utf-8") as file:
                  file.write(updated)
              print(f"Updated Latest Projects with {len(latest)} public repositories.")

          PY

      - name: Commit and push README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi
          git commit -m "chore: update latest projects"
          git push
