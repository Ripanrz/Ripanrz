<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 44" role="img" aria-labelledby="title desc">
<title id="title">Falling maple leaves</title>
<desc id="desc">A subtle row of animated autumn leaves drifting down beneath the anime banner.</desc>
<style>
  .leaf{transform-box:fill-box;transform-origin:center;animation:fall 5.6s ease-in-out infinite}
  .l2{animation-delay:-1.1s;animation-duration:6.2s}
  .l3{animation-delay:-2.4s;animation-duration:5.1s}
  .l4{animation-delay:-3.7s;animation-duration:6.7s}
  .l5{animation-delay:-.8s;animation-duration:5.8s}
  .l6{animation-delay:-2.9s;animation-duration:6.4s}
  .l7{animation-delay:-4.4s;animation-duration:5.4s}
  .l8{animation-delay:-1.9s;animation-duration:7s}
  @keyframes fall{
    0%{transform:translate(0,-18px) rotate(0deg);opacity:0}
    14%{opacity:.92}
    58%{transform:translate(18px,26px) rotate(115deg);opacity:.8}
    100%{transform:translate(-7px,66px) rotate(245deg);opacity:0}
  }
  @media(prefers-reduced-motion:reduce){.leaf{animation:none!important;opacity:0}}
</style>
<g fill="#d98c52">
  <path class="leaf" d="M62 2q7-9 11 0l7 4-8 4-4 7-5-7-7-4z"/>
  <path class="leaf l2" d="M174 8q7-9 11 0l7 4-8 4-4 7-5-7-7-4z" fill="#bd654e"/>
  <path class="leaf l3" d="M292 0q7-9 11 0l7 4-8 4-4 7-5-7-7-4z" fill="#e1ad62"/>
  <path class="leaf l4" d="M408 10q7-9 11 0l7 4-8 4-4 7-5-7-7-4z"/>
  <path class="leaf l5" d="M542 1q7-9 11 0l7 4-8 4-4 7-5-7-7-4z" fill="#bd654e"/>
  <path class="leaf l6" d="M676 7q7-9 11 0l7 4-8 4-4 7-5-7-7-4z" fill="#e1ad62"/>
  <path class="leaf l7" d="M804 1q7-9 11 0l7 4-8 4-4 7-5-7-7-4z"/>
  <path class="leaf l8" d="M916 11q7-9 11 0l7 4-8 4-4 7-5-7-7-4z" fill="#bd654e"/>
</g>
</svg>