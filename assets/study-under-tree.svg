  <path d="M522 124q5 5 9 0m16 0q5 5 9 0" fill="none" stroke="#57413b" stroke-width="3" stroke-linecap="round"/>
  <path d="M537 137q7 5 13-1" fill="none" stroke="#c47d73" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M506 122q-12-4-9 10q3 8 11 5m56-16q12-4 9 10q-3 8-11 5" fill="#f0c4a3" class="fine"/>
  <!-- arm holding book -->
  <path d="M500 183Q480 196 468 218L442 227Q433 235 440 245Q450 251 462 242L496 229Q516 211 519 192Z" fill="#f0c4a3" class="line"/>
  <path d="M566 183Q584 194 590 216L612 229Q622 237 614 246Q604 251 593 241L566 228Q550 207 550 190Z" fill="#f0c4a3" class="line"/>
</g>

