  <path d="M403 257q25-2 38 10q8 10-4 16l-29-4-12-8Z" fill="#f4eee3" class="line"/>
  <path d="M322 245q-6 17-24 25l-36 4q-15 0-12-11q12-14 35-24l21-10Z" fill="#334b62" class="line"/>
