  <!-- neck and face -->
  <path d="M335 143v20q14 13 28-1v-24Z" fill="#d99f7d" class="line"/>
  <ellipse cx="351" cy="120" rx="31" ry="38" fill="#e9b996" class="line"/>
  <path d="M320 120Q307 84 335 80Q358 62 380 82Q396 99 381 129L372 104Q355 113 339 105Q334 120 320 120Z" fill="#3f3735" class="hair"/>
  <path d="M323 105Q336 91 347 95Q367 101 382 92" fill="none" stroke="#65524a" stroke-width="4"/>
  <path d="M341 125q5 5 9 0m15 0q5 5 9 0" fill="none" stroke="#513d39" stroke-width="3" stroke-linecap="round"/>
  <path d="M355 136q7 5 13-1" fill="none" stroke="#b96e65" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320 121q-12-4-8 10q3 8 12 4m67-14q12-4 8 10q-3 8-12 4" fill="#e9b996" class="line"/>
  <!-- relaxed arm -->
  <path d="M389 178Q409 190 422 215L445 224Q455 231 446 242Q437 248 425 239L395 224Q379 207 376 190Z" fill="#e9b996" class="line"/>
  <!-- hand on laptop edge -->
  <path d="M437 232q9-8 17 0q7 8-2 13q-9 5-16-4" fill="#e9b996" class="fine"/>
</g>

<!-- girl, leaning in with an open book -->
<g>
  <!-- skirt and legs -->
  <path d="M510 223Q536 218 563 235L584 263Q573 279 552 278L511 260Q496 245 510 223Z" fill="#bd7777" class="line"/>
