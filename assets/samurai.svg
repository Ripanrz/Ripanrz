<title id="title">Ripan — Digital Ronin</title><desc id="desc">An original pixel-art samurai performs a katana slash beneath a moonlit Japanese night sky.</desc>
<style>
*{shape-rendering:crispEdges}.bob{animation:bob 1.4s steps(2,end) infinite;transform-origin:250px 90px}.sword{transform-origin:265px 96px;animation:draw 2.8s steps(7,end) infinite}.slash{opacity:0;animation:slash 2.8s steps(1,end) infinite}.petal-a{animation:drift-a 6s linear infinite}.petal-b{animation:drift-b 7.5s linear infinite}.spark{animation:sparkle 1.4s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes draw{0%,37%{transform:rotate(0)}48%{transform:rotate(-42deg)}58%,72%{transform:rotate(-78deg)}84%,100%{transform:rotate(0)}}@keyframes slash{0%,53%,78%,100%{opacity:0}58%,72%{opacity:1}}@keyframes drift-a{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(46px,92px);opacity:0}}@keyframes drift-b{0%{transform:translate(0,0);opacity:0}18%{opacity:1}100%{transform:translate(-36px,112px);opacity:0}}@keyframes sparkle{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bob,.sword,.slash,.petal-a,.petal-b,.spark{animation:none!important}}
</style>
