<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 137" role="img" aria-labelledby="title desc">
<title id="title">Ripanrz — anime study under the maple tree</title>
<desc id="desc">The user's chosen anime banner, showing two students studying beneath an autumn maple tree at sunset, with a gentle falling-leaf animation.</desc>
<style>
  .leaf{transform-box:fill-box;transform-origin:center;animation:fall 5.8s ease-in-out infinite}
  .l2{animation-delay:-1.2s;animation-duration:6.6s}
  .l3{animation-delay:-2.4s;animation-duration:5.2s}
  .l4{animation-delay:-3.6s;animation-duration:7s}
  .l5{animation-delay:-4.1s;animation-duration:6.1s}
  @keyframes fall{0%{transform:translate(0,-16px) rotate(0deg);opacity:0}14%{opacity:.95}55%{transform:translate(17px,76px) rotate(100deg)}100%{transform:translate(-8px,155px) rotate(230deg);opacity:0}}
  @media(prefers-reduced-motion:reduce){.leaf{animation:none!important;opacity:0}}
</style>
<image x="0" y="0" width="640" height="34" xlink:href="anime-banner-strip-1.jpg"/>
<image x="0" y="34" width="640" height="34" xlink:href="anime-banner-strip-2.jpg"/>
<image x="0" y="68" width="640" height="35" xlink:href="anime-banner-strip-3.jpg"/>
<image x="0" y="103" width="640" height="34" xlink:href="anime-banner-strip-4.jpg"/>
<g fill="#e49a51">
 <path class="leaf" d="M96 3q7-10 12 0l5 5-8 3-4 7-5-7-7-3z"/>
 <path class="leaf l2" d="M254 1q7-10 12 0l5 5-8 3-4 7-5-7-7-3z"/>
 <path class="leaf l3" d="M418 9q7-10 12 0l5 5-8 3-4 7-5-7-7-3z"/>
 <path class="leaf l4" d="M556 0q7-10 12 0l5 5-8 3-4 7-5-7-7-3z"/>
 <path class="leaf l5" d="M32 14q7-10 12 0l5 5-8 3-4 7-5-7-7-3z"/>
</g>
</svg>